syntax = "proto3";

package asset.v1;

option go_package = "short-drama-platform/proto/gen/go/asset/v1;assetv1";

import "common/common.proto";

// AssetService — media asset management, upload, share
service AssetService {
  rpc CreateAsset(CreateAssetRequest) returns (CreateAssetResponse);
  rpc GetAsset(GetAssetRequest) returns (GetAssetResponse);
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse);
  rpc DeleteAsset(DeleteAssetRequest) returns (common.Empty);
  rpc ShareAsset(ShareAssetRequest) returns (ShareAssetResponse);
  rpc RecordUsage(RecordUsageRequest) returns (common.Empty);
}

message Asset {
  string id = 1;
  string owner_id = 2;
  string type = 3;            // "image", "video", "audio", "script"
  string url = 4;
  string thumbnail_url = 5;
  string object_key = 6;      // Storage object key
  int64 file_size = 7;
  string access = 8;          // "private", "shared", "public"
  int64 created_at = 9;
}

message AssetUsage {
  int64 id = 1;
  string asset_id = 2;
  string user_id = 3;
  string model_type = 4;
  int32 count = 5;
  string endpoint = 6;
  string service_name = 7;
  int64 created_at = 8;
}

message AssetShare {
  int64 id = 1;
  string asset_id = 2;
  string owner_id = 3;
  string shared_with = 4;
  int64 created_at = 5;
}

message CreateAssetRequest {
  string type = 1;
  string url = 2;
  string object_key = 3;
  int64 file_size = 4;
  string owner_id = 5;
  string access = 6;
}

message CreateAssetResponse {
  string asset_id = 1;
}

message GetAssetRequest {
  string asset_id = 1;
}

message GetAssetResponse {
  Asset asset = 1;
}

message ListAssetsRequest {
  string owner_id = 1;
  common.Pagination pagination = 2;
  string type_filter = 3;
}

message ListAssetsResponse {
  repeated Asset assets = 1;
  int32 total = 2;
}

message DeleteAssetRequest {
  string asset_id = 1;
}

message ShareAssetRequest {
  string asset_id = 1;
  string shared_with = 2;     // User ID or "public"
}

message ShareAssetResponse {
  string share_id = 1;
}

message RecordUsageRequest {
  string user_id = 1;
  string model_name = 2;
  int32 count = 3;
  string endpoint = 4;
  string service_name = 5;
}
