apiVersion: v1
kind: Service
metadata:
  name: final-cut-service
  namespace: shortdrama
spec:
  ports:
    - port: 8085
  selector:
    app: final-cut-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: final-cut-service
  namespace: shortdrama
spec:
  replicas: 2
  minReadySeconds: 15
  selector:
    matchLabels:
      app: final-cut-service
  template:
    metadata:
      labels:
        app: final-cut-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9085"
    spec:
      containers:
        - name: final-cut-service
          image: shortdrama/final-cut-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: shortdrama-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shortdrama-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shortdrama-secrets
                  key: DB_PASSWORD
            - name: STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: shortdrama-secrets
                  key: STORAGE_ACCESS_KEY
            - name: STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: shortdrama-secrets
                  key: STORAGE_SECRET_KEY
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: ffmpeg-workdir
              mountPath: /tmp/final-cut-workdir
          livenessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: ffmpeg-workdir
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: final-cut-service-hpa
  namespace: shortdrama
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: final-cut-service
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
