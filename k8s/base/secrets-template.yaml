# ============================================================
# 生产环境密钥模版 — DO NOT COMMIT REAL VALUES
# ============================================================
#
# 安全最佳实践 (按推荐度排序):
#
#   方案 A — External Secrets Operator (生产环境，强烈推荐):
#     kubectl apply -f ../security/external-secrets.yaml
#     # 密钥存储在 Vault / AWS Secrets Manager / GCP Secret Manager
#     # 应用通过 ExternalSecret CRD 自动同步到 K8s Secret
#
#   方案 B — SealedSecrets (无外部 Vault 时使用):
#     cp secrets-template.yaml secrets.yaml
#     # 编辑 secrets.yaml 填入真实密钥
#     kubeseal --format yaml < secrets.yaml > secrets-sealed.yaml
#     kubectl apply -f secrets-sealed.yaml
#     # 将 secrets-sealed.yaml 提交到 git (已加密，安全)
#
#   方案 C — kubectl (仅限本地开发环境！):
#     cp secrets-template.yaml secrets.yaml
#     # 编辑 secrets.yaml 填入真实密钥
#     kubectl apply -f secrets.yaml
#     # 注意: secrets.yaml 已在 .gitignore 中，不会被提交
#
# 生成安全的随机密钥:
#   openssl rand -base64 64
#   python3 -c "import secrets; print(secrets.token_urlsafe(64))"
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: shortdrama-secrets
  namespace: shortdrama
type: Opaque
stringData:
  # ── 数据库 (MySQL / TiDB) ──
  DB_USER: "admin"
  DB_PASSWORD: "<CHANGE-ME>"
  DB_ROOT_PASSWORD: "<CHANGE-ME>"

  # ── Redis ──
  REDIS_PASSWORD: "<CHANGE-ME>"

  # ── RabbitMQ ──
  RABBITMQ_USER: "admin"
  RABBITMQ_PASSWORD: "<CHANGE-ME>"

  # ── MinIO / S3 对象存储 ──
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "<CHANGE-ME>"
  STORAGE_ACCESS_KEY: "<CHANGE-ME>"
  STORAGE_SECRET_KEY: "<CHANGE-ME>"

  # ── AI 模型 API Keys ──
  DEEPSEEK_API_KEY: "<YOUR-DEEPSEEK-API-KEY>"
  SEEDANCE_API_KEY: "<YOUR-SEEDANCE-API-KEY>"
  OPENAI_API_KEY: "<YOUR-OPENAI-API-KEY>"
  ANTHROPIC_API_KEY: "<YOUR-ANTHROPIC-API-KEY>"

  # ── JWT + 应用安全 ──
  JWT_SECRET_KEY: "<GENERATE-RANDOM-64-CHAR-STRING>"
  SECRET_KEY: "<GENERATE-RANDOM-64-CHAR-STRING>"
